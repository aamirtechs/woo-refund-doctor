[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "woo-refund-doctor"
version = "1.0.0"
description = "Audit a WooCommerce refunds CSV export"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
woo-refund-doctor = "woo_refund_doctor:main_entry"

[tool.setuptools]
py-modules = ["woo_refund_doctor"]
